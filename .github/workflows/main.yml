name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: Build SeewoKiller C++

    steps:
      # 1. 检出当前仓库
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. 下载并安装 MinGW 16.2.0 (x86_64-16.2.0-release-win32-seh-msvcrt-rt_v14-rev1)
      - name: 下载并安装 MinGW 16.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-win32-seh-msvcrt-rt_v14-rev1.7z"
          $outFile = "$env:RUNNER_TEMP\mingw.7z"
          $extractDir = "$env:RUNNER_TEMP\mingw-extract"

          Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing

          # 清空并创建解压目录
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

          7z x $outFile -o"$extractDir" -y | Out-Null

          # 打印解压后的目录结构，便于排查
          Write-Host "===== Extracted tree (2 levels) ====="
          Get-ChildItem $extractDir -Recurse -Depth 2 | Select-Object FullName

          # 动态查找 g++.exe
          $gpp = Get-ChildItem -Path $extractDir -Recurse -Filter "g++.exe" -File | Select-Object -First 1
          if (-not $gpp) {
            Write-Error "g++.exe not found under $extractDir"
          }
          $mingwBin = $gpp.Directory.FullName
          Write-Host "Found MinGW bin dir: $mingwBin"

          # 写入 GITHUB_PATH
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin

          # 验证
          & "$mingwBin\g++.exe" --version
          & "$mingwBin\mingw32-make.exe" --version
          & "$mingwBin\windres.exe" --version

      # 3. 克隆依赖仓库 (包含 lib/.a/.dll, bin, include)
      - name: 下载依赖
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/whstu/SeewoKiller-BuildDependency.git "$env:GITHUB_WORKSPACE\BuildDependency"

      # 3.5 打印依赖仓库结构，确认 include/lib 布局
      - name: Inspect BuildDependency layout
        shell: pwsh
        run: |
          $dep = "$env:GITHUB_WORKSPACE\BuildDependency"
          Write-Host "===== Top level ====="
          Get-ChildItem $dep | Select-Object Name, Mode
          Write-Host "===== include (2 levels) ====="
          if (Test-Path "$dep\include") {
            Get-ChildItem "$dep\include" -Recurse -Depth 1 | Select-Object FullName
          }
          Write-Host "===== lib ====="
          if (Test-Path "$dep\lib") {
            Get-ChildItem "$dep\lib" | Select-Object Name
          }

      # 4. 编译目标文件
      - name: 编译主程序
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"

          set "DEP_DIR=%GITHUB_WORKSPACE%\BuildDependency"
          set "INC_ROOT=%DEP_DIR%\include"
          set "INC_CURL=%DEP_DIR%\include\curl"
          set "INC_ARCHIVE=%DEP_DIR%\include\libarchive"
          set "INC_CONFIG=%DEP_DIR%\include\libconfig"

          REM 若 curl 头文件直接在 include 根目录，可同时给出两条 -I，GCC 会自动找到
          set "INCS=-I"%INC_ROOT%" -I"%INC_CURL%" -I"%INC_ARCHIVE%" -I"%INC_CONFIG%""

          g++.exe -c "files.cpp" -o "files.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

          g++.exe -c "game.cpp" -o "game.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

          g++.exe -c "CameraRec.cpp" -o "CameraRec.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

          g++.exe -c "cmdCtrl.cpp" -o "cmdCtrl.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

          g++.exe -c ".spl_WHSTU_Rainbow.cpp" -o ".spl_WHSTU_Rainbow.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

          g++.exe -c "web.cpp" -o "web.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

          g++.exe -c "main.cpp" -o "main.o" %INCS% -Ofast -pipe -Wno-narrowing -finput-charset=UTF-8 -fexec-charset=gbk
          if errorlevel 1 exit /b 1

      # 5. 编译资源文件 (.rc -> .res)
      - name: 编译res文件
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          windres.exe -i "SeewoKiller_private.rc" --input-format=rc -o "SeewoKiller_private.res" -O coff
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      # 6. 链接生成可执行文件
      #    注意：-static 静态链接所有库，字符集已在编译阶段通过 -fexec-charset=gbk 控制
      - name: 链接生成exe文件
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          
          set "DEP_DIR=%GITHUB_WORKSPACE%\BuildDependency"
          set "CURL_LIB=%DEP_DIR%\lib"
          set "EXTRA_LIB=%DEP_DIR%\lib"
          
          g++.exe "files.o" "game.o" "CameraRec.o" "cmdCtrl.o" ".spl_WHSTU_Rainbow.o" "web.o" "main.o" "SeewoKiller_private.res" -o "SeewoKiller.exe" -L"%CURL_LIB%" -L"%EXTRA_LIB%" -s -lShell32 -lOle32 -lvfw32 -lwinmm -lole32 -luuid -lcurl -lwldap32 -limm32 "%CURL_LIB%\libcurl.a" "%CURL_LIB%\libcurl.dll.a" "%EXTRA_LIB%\libarchive.a" "%EXTRA_LIB%\libconfig.dll.a" "%EXTRA_LIB%\libconfig++.dll.a" -static
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      # 7. 收集所有需要打包的文件 (exe + 依赖库)
      - name: Collect artifacts
        shell: pwsh
        run: |
          $staging = "$env:GITHUB_WORKSPACE\staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          
          # 复制可执行文件
          Copy-Item "$env:GITHUB_WORKSPACE\SeewoKiller.exe" -Destination $staging
          
          # 复制依赖仓库中的 lib (包含 .a / .dll / .dll.a) 和 bin (运行时 dll)
          $depDir = "$env:GITHUB_WORKSPACE\BuildDependency"
          if (Test-Path "$depDir\lib") {
            Copy-Item "$depDir\lib\*" -Destination $staging -Recurse -Force
          }
          if (Test-Path "$depDir\bin") {
            Copy-Item "$depDir\bin\*" -Destination $staging -Recurse -Force
          }
          
          # 列出打包内容
          Get-ChildItem $staging -Recurse | Select-Object FullName

      # 7.5 条件复制 7z.exe (仅 main/master 分支加入)
      - name: 条件复制 7z
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.base_ref == 'main' || github.base_ref == 'master'
        shell: pwsh
        run: |
          $staging = "$env:GITHUB_WORKSPACE\staging"
          # 假设 7z.exe 位于仓库根目录，如在不同子目录请调整路径
          $sevenZipPath = "$env:GITHUB_WORKSPACE\7za.exe"
          $procgovPath="$env:GITHUB_WORKSPACE\procgov.exe"
          Copy-Item $sevenZipPath -Destination $staging -Force
          Copy-Item $procgovPath -Destination $staging -Force

      # 8. 将 staging 目录打包为 zip
      - name: 打包
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\staging\*" -DestinationPath "$env:GITHUB_WORKSPACE\SeewoKiller-Build.zip" -Force
          Get-Item "$env:GITHUB_WORKSPACE\SeewoKiller-Build.zip" | Select-Object Name, Length

      # 9. 上传 Artifacts (不执行 Commit)
      - name: 上传 artifact
        uses: actions/upload-artifact@v6
        with:
          name: SeewoKiller-Build
          path: SeewoKiller-Build.zip
          retention-days: 7


  build-setup-custom:
    runs-on: windows-latest
    name: Build setup-custom.exe
    needs: build
    env:
      TARGET_DIR: E:\devc++\DEV\SeewoKiller

    steps:
      # 1. 创建目标目录并将 E 盘映射到 D 盘，使 E:\devc++\DEV\SeewoKiller 可用
      - name: 准备目标目录并映射 E:\
        shell: pwsh
        run: |
          if (Test-Path "E:\") { subst E: /D }
          New-Item -ItemType Directory -Path "D:\devc++\DEV\SeewoKiller" -Force | Out-Null
          subst E: D:\
          if (-not (Test-Path $env:TARGET_DIR)) {
            Write-Error "目标目录创建失败: $env:TARGET_DIR"
          }

      # 2. 下载第一个 job 的 artifact
      - name: 下载 artifact
        uses: actions/download-artifact@v6
        with:
          name: SeewoKiller-Build
          path: ${{ github.workspace }}\artifact-download

      # 3. 解压 artifact 到目标目录
      - name: 解压 artifact 到目标目录
        shell: pwsh
        run: |
          $zipPath = "${{ github.workspace }}\artifact-download\SeewoKiller-Build.zip"
          if (-not (Test-Path $zipPath)) {
            $items = Get-ChildItem "${{ github.workspace }}\artifact-download" -File
            if ($items.Count -eq 1 -and $items[0].Extension -eq '.zip') {
              $zipPath = $items[0].FullName
            } else {
              Copy-Item "${{ github.workspace }}\artifact-download\*" $env:TARGET_DIR -Recurse -Force
              exit 0
            }
          }
          Expand-Archive -Path $zipPath -DestinationPath $env:TARGET_DIR -Force

      # 4. 克隆 whstu/SeewoKiller 仓库（根据当前分支自动选择，失败回退 main）
      - name: 克隆 SeewoKiller 仓库
        shell: pwsh
        run: |
          # $branch = "${{ github.ref_name }}"
          $branch = "dev"
          $repo = "${{ github.workspace }}\SeewoKillerRepo"
          git clone --depth 1 --branch $branch https://github.com/whstu/SeewoKiller.git $repo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "分支 $branch 克隆失败，回退到 main 分支"
            git clone --depth 1 --branch main https://github.com/whstu/SeewoKiller.git $repo
          }

      # 5. 复制必要文件到目标目录
      - name: 复制必要文件到目标目录
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}\SeewoKillerRepo"
          $dst  = $env:TARGET_DIR
          Copy-Item "$repo\app.ico"           $dst -Force
          Copy-Item "$repo\seewokiller2.png"  $dst -Force
          Copy-Item "$repo\ai.exe"            $dst -Force
          Copy-Item "$repo\gui.exe"           $dst -Force
          Copy-Item "$repo\RunAsFastboot.exe" $dst -Force
          Copy-Item "$repo\SeewoFreeze"       $dst -Recurse -Force
          Copy-Item "$repo\pai.exe"           $dst -Force
          Copy-Item "$repo\7za.exe"           $dst -Force
          Copy-Item "$repo\procgov.exe"       $dst -Force
          Copy-Item "$repo\!Licence.txt"      $dst -Force
          Copy-Item "$repo\installer\main-custom.iss" $dst -Force

      # 6. 使用 Inno Setup 编译 main-custom.iss
      - name: 编译 Inno Setup 脚本
        shell: cmd
        run: |
          cd /d "%TARGET_DIR%"
          "%GITHUB_WORKSPACE%\SeewoKillerRepo\BuildTools\Inno Setup 编译器\ISCC.exe" "main-custom.iss"
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      # 7. 使用 signtool 签名
      - name: 签名 SeewoKiller_custom.exe
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\SeewoKillerRepo\BuildTools\signtool"
          set PFX=%GITHUB_WORKSPACE%\SeewoKillerRepo\BuildTools\signtool\sign-password114514.pfx
          set PASS=114514
          set TIMESTAMP=http://timestamp.digicert.com
          set ALG=SHA512
          .\signtool.exe sign /f "%PFX%" /p %PASS% /t %TIMESTAMP% /fd %ALG% /v "%TARGET_DIR%\SeewoKiller_custom.exe"
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      # 8. 上传 SeewoKiller_custom.exe 到 artifacts
      - name: 上传 SeewoKiller_custom.exe
        uses: actions/upload-artifact@v6
        with:
          name: SeewoKiller-custom
          path: E:\devc++\DEV\SeewoKiller\SeewoKiller_custom.exe
          retention-days: 7